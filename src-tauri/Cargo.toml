[package]
name = "tauri-motrix"
version = "0.2.5"
description = "A Tauri App"
authors = ["Taoister39"]
repository = "https://github.com/Taoister39/tauri-motrix"
edition = "2021"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_motrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12.3"
once_cell = "1.21.3"
dunce = "1.0.5"
anyhow = "1.0.97"
log.workspace = true
serde_yaml = "0.9.34"
tokio.workspace = true
upnp-mapping = { path = "../crates/upnp-mapping" }
fs2 = "0.4.3"
tauri-plugin-shell = "2.2.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
chrono = "0.4.40"
log4rs = "1.3.0"
tauri-plugin-notification = "2"
open = "5.3.2"
sys-locale = "0.3.2"
reqwest = "0.12.15"
tauri-motrix-vortex = { path = "../crates/vortex" }
uuid = { version = "1.16.0", features = ["v4", "serde"] }
base64 = "0.22"
trash.workspace = true
same-file.workspace = true
tempfile.workspace = true
png.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true
block2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
glib.workspace = true
gio.workspace = true
gdk-pixbuf.workspace = true
gtk.workspace = true
md-5.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[dependencies.tauri-plugin-sql]
features = ["sqlite"] # or "postgres", or "mysql"

version = "2.0.0"
