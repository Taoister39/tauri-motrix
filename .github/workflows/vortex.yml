name: Vortex
on:
  pull_request:
    paths:
      - "crates/vortex/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/vortex.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p tauri-motrix-vortex
