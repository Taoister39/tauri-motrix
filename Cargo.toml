[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.dependencies]
tauri-plugin-global-shortcut = "=2.2.0"
igd-next = { version = "0.17", features = ["aio_tokio"] }
log = "0.4.27"
tokio = "1.44.1"
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio-util = "0.7"
sha2 = "0.10"
bytes = "1"
fs2 = "0.4.3"
httpdate = "1"
tempfile = "3"
percent-encoding = "2"
trash = "5.2.9"
same-file = "1.0.6"
png = "0.17.16"
windows = "0.61.3"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.1"
objc2-core-graphics = "0.3.2"
block2 = "0.6.1"
glib = "0.18.5"
gio = "0.18.4"
gdk-pixbuf = "0.18.5"
gtk = "0.18.2"
md-5 = "0.10.6"

[workspace.lints.clippy]
dbg_macro = "deny"
